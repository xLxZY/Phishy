services:

  postgres:
    image: postgres:17
    container_name: phishy-postgres

    restart: always

    environment:
      POSTGRES_USER: phishy
      POSTGRES_PASSWORD: phishy_password
      POSTGRES_DB: phishy_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: phishy-redis

    restart: always

    ports:
      - "6379:6379"

  n8n:
    image: n8nio/n8n:latest
    container_name: phishy-n8n

    restart: always

    ports:
      - "5678:5678"

    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=phishy_admin_password

      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=phishy
      - DB_POSTGRESDB_PASSWORD=phishy_password

      - GENERIC_TIMEZONE=UTC

    volumes:
      - n8n_data:/home/node/.n8n
  api:
    build:
      context: ../backend

    container_name: phishy-api

    restart: always

    ports:
      - "8000:8000"

    depends_on:
      - postgres

    env_file:
      - ../.env

volumes:

  postgres_data:
  n8n_data:
